services:
  postgres:
    image: postgres:16-alpine
    container_name: retailpulse-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - retailpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-retailpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  retailpulse_postgres_data:
    name: retailpulse_postgres_data
